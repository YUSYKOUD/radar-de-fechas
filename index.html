<style>
:root {

}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  color:var(--text);
  background:

    radial-gradient(circle at 95% 12%,rgba(69,227,255,.12),transparent 25%),
    radial-gradient(circle at 54% 94%,rgba(255,74,194,.10),transparent 33%),
    var(--bg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body:before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:linear-gradient(115deg,transparent 10%,rgba(255,255,255,.02) 24%,rgba(152,111,255,.08) 38%,rgba(73,229,255,.06) 51%,rgba(255,83,209,.06) 65%,transparent 82%);
  background-size:260% 260%;
  animation:holo 14s ease-in-out infinite alternate;
}
@keyframes holo{from{background-position:0 45%}to{background-position:100% 55%}}
.wrap{width:min(1320px,calc(100% - 34px));margin:auto;padding:58px 0 90px}
header{max-width:830px;margin-bottom:24px}
.kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;font-weight:800;color:#c8cbd5;margin-bottom:14px}
h1{font-size:clamp(44px,7.5vw,92px);line-height:.88;letter-spacing:-.07em;margin:0;font-weight:900}
.holoText{
  background:linear-gradient(100deg,#fff,#c8b8ff,#78e9ff,#ffb9eb,#fff);
  background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:holoText 7s linear infinite;
}
@keyframes holoText{to{background-position:220% center}}
.intro{max-width:680px;color:var(--muted);font-size:16px;line-height:1.6;margin:20px 0 0}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:19px}
.pill{font-size:11px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.035);color:#bfc3ce}
.brand-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px}
.brand{
  min-height:102px;padding:18px;position:relative;overflow:hidden;cursor:pointer;text-align:left;color:#fff;font:inherit;
  border:1px solid var(--line);border-radius:19px;background:var(--glass);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  transition:.22s ease;
}
.brand:before{content:"";position:absolute;inset:-1px;background:linear-gradient(120deg,rgba(255,255,255,.22),rgba(160,102,255,.14),rgba(66,224,255,.16),rgba(255,86,201,.12));opacity:.16;transition:.2s}
.brand:hover,.brand.active{transform:translateY(-3px);background:var(--glass2);border-color:rgba(255,255,255,.28);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand:hover:before,.brand.active:before{opacity:.48}
.brand > *{position:relative;z-index:1}
.brand-name{font-weight:800;font-size:18px;letter-spacing:-.03em}
.brand-count{display:block;color:#8f94a2;font-size:11px;margin-top:8px}
.plus{position:absolute;right:15px;bottom:12px;font-size:19px;color:#c5c8d0;transition:.2s;z-index:2}
.brand.active .plus{transform:rotate(45deg)}
.detail{margin-top:18px}
.panel{
  display:none;border:1px solid rgba(255,255,255,.13);border-radius:29px;padding:30px;
  background:rgba(11,12,17,.78);backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px);
  box-shadow:0 30px 90px rgba(0,0,0,.34);animation:open .3s ease;overflow:hidden;position:relative;
}
.panel.open{display:block}
.panel:before{content:"";position:absolute;width:470px;height:470px;border-radius:50%;right:-190px;top:-300px;background:radial-gradient(circle,rgba(104,229,255,.13),rgba(165,102,255,.09) 42%,rgba(255,76,202,.05) 64%,transparent 72%);pointer-events:none}
@keyframes open{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.panel-head{position:relative;z-index:1;display:flex;justify-content:space-between;gap:20px;padding-bottom:23px;border-bottom:1px solid rgba(255,255,255,.08)}
.panel h2{font-size:clamp(30px,4vw,50px);letter-spacing:-.05em;margin:0;line-height:1}
.panel-desc{color:var(--muted);margin:9px 0 0;line-height:1.5}
.close{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;font-size:19px;cursor:pointer}
.summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.section-label{font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;color:#adb1bd;margin:27px 0 8px}
.dedupe-note{font-size:11px;color:#7f8593;margin-bottom:14px}
.theme-section{border-top:1px solid rgba(255,255,255,.075);padding:24px 0 4px}
.theme-section:first-of-type{border-top:0}
.theme-head{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:start;margin-bottom:14px}
.theme-icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:14px;font-size:22px}
.theme-title{font-size:19px;font-weight:800;letter-spacing:-.025em}
.theme-desc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:4px}
.theme-total{font-size:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:6px 9px;color:#bfc3ce}
.months-wrap{display:flex;flex-direction:column;gap:30px;margin-top:20px}
.month-section{padding-top:6px}
.month-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid rgba(255,255,255,.09)}
.month-name{font-size:20px;font-weight:900;letter-spacing:-.03em}
.month-count{font-size:10px;color:#969baa;border:1px solid var(--line);border-radius:999px;padding:5px 8px;background:rgba(255,255,255,.035)}
.month-empty{font-size:12px;color:#646a78;padding:8px 2px 2px}
.theme-chip{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#bec3cf;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.035);padding:5px 7px;border-radius:999px}
.dates{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.date-card{border:1px solid rgba(255,255,255,.085);border-radius:15px;background:rgba(255,255,255,.032);padding:13px 14px;min-height:104px;transition:.18s}
.date-card:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.17);transform:translateY(-1px)}
.date-top{display:flex;justify-content:space-between;gap:9px;align-items:flex-start}
.date-number{font-size:12px;font-weight:900;letter-spacing:.04em;color:#fff}
.type{font-size:9px;text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border-radius:999px;background:linear-gradient(100deg,rgba(157,112,255,.16),rgba(61,224,255,.12),rgba(255,85,203,.12));border:1px solid rgba(255,255,255,.08);color:#cdd0da;text-align:right}
.event-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.event-item + .event-item{padding-top:9px;border-top:1px solid rgba(255,255,255,.07)}
.event-name{font-size:13px;font-weight:750;line-height:1.35;margin-top:0}
.event-mini-type{font-size:9px;color:#787e8c;margin-top:4px;text-transform:uppercase;letter-spacing:.04em}
.cross-themes{font-size:9px;color:#a9afbb;margin-top:9px;padding-top:8px;border-top:1px dashed rgba(255,255,255,.08)}
.source{font-size:10px;color:#777d8c;margin-top:7px}
.empty{color:#7d8290;font-size:13px;padding:15px 0}
.legend{margin-top:28px;padding-top:20px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#757b89;line-height:1.55}
.footer{text-align:center;color:#606572;font-size:10px;letter-spacing:.11em;text-transform:uppercase;margin-top:34px}
@media(max-width:1100px){.brand-grid{grid-template-columns:repeat(4,1fr)}.dates{grid-template-columns:repeat(2,1fr)}}

@media(max-width:520px){.wrap{width:min(100% - 22px,1320px)}.brand{min-height:86px;padding:15px}.brand-name{font-size:15px}.panel{padding:21px 16px}.theme-head{grid-template-columns:42px 1fr}.theme-total{grid-column:2;justify-self:start}}
</style>
</head>

const grid = document.getElementById("brandGrid");
const detail = document.getElementById("detail");
let current = null;

function eventKey(ev){
  const [d,m] = ev.date.split("-").map(Number);
  return m*100+d;
}
events.sort((a,b)=>eventKey(a)-eventKey(b));

const eventByName = Object.fromEntries(events.map(ev => [ev.name, ev]));

function assignedEventsByTheme(brand){
  const assignments = brand.themes.map(() => []);
  const schedule = brandSchedules[brand.name] || [];

  schedule.forEach(day => {
    const dayEvents = day.events
      .map(name => eventByName[name])
      .filter(Boolean);

    assignments[day.theme].push({
      date: day.date,
      events: dayEvents,
      themeLabels: day.themeLabels || []
    });
  });

  return assignments;
}

function prettyDate(date){
  const [d,m] = date.split("-");
  const months=["ENE","FEB","MAR","ABR","MAY","JUN","JUL","AGO","SEP","OCT","NOV","DIC"];
  return `${d} ${months[Number(m)-1]}`;
}

function uniqueEvents(list){
  const seen = new Set();
  return list.filter(ev => {
    const k = ev.date + "|" + ev.name;
    if(seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function brandEventCount(brand){
  return (brandSchedules[brand.name] || []).length;
}

function renderGrid(){
  grid.innerHTML = brands.map((b,i)=>`
    <button class="brand" data-i="${i}" aria-expanded="false">
      <span class="brand-name">${b.name}</span>
      <span class="brand-count">${brandEventCount(b)} oportunidades</span>
      <span class="plus">＋</span>
    </button>
  `).join("");

  document.querySelectorAll(".brand").forEach(btn => {
    btn.onclick = () => openBrand(Number(btn.dataset.i));
  });
}

function openBrand(i){
  const buttons=[...document.querySelectorAll(".brand")];

  if(current===i){
    current=null;
    detail.innerHTML="";
    buttons.forEach(b=>{b.classList.remove("active");b.setAttribute("aria-expanded","false")});
    return;
  }

  current=i;
  buttons.forEach((b,idx)=>{
    const active=idx===i;
    b.classList.toggle("active",active);
    b.setAttribute("aria-expanded",active);
  });

  const brand=brands[i];
  const assigned=assignedEventsByTheme(brand);
  const allDays=assigned.flat();
  const allEvents=allDays.flatMap(day => day.events);
  const total=allDays.length;
  const currentEvents=allEvents.filter(e=>e.type.includes("2026")).length;
  const pop=allEvents.filter(e=>e.type.includes("Cultura pop")||e.type.includes("Aniversario")).length;

  detail.innerHTML=`
  <article class="panel open">
    <div class="panel-head">
      <div>
        <h2>${brand.name}</h2>
        <p class="panel-desc">${brand.desc}</p>
        <div class="summary">
          <span class="pill">${brand.themes.length} temáticas</span>
          <span class="pill">${total} oportunidades</span>
          <span class="pill">${currentEvents} eventos 2026</span>
          <span class="pill">${pop} hitos pop / aniversarios</span>
        </div>
      </div>
      <button class="close" aria-label="Cerrar">×</button>
    </div>

    <div class="section-label">Efemérides ordenadas por mes</div>
    <div class="dedupe-note">De enero a diciembre. Cada fecha conserva su temática para que puedas identificar rápidamente el territorio de contenido.</div>

    ${(()=>{
      const monthNames=["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];
      const allDays=assigned.flatMap((days,themeIndex)=>days.map(day=>({...day,themeIndex})));
      const monthBuckets=monthNames.map((_,monthIndex)=>
        allDays.filter(day=>Number(day.date.split("-")[1])===monthIndex+1)
               .sort((a,b)=>Number(a.date.split("-")[0])-Number(b.date.split("-")[0]))
      );

      return `<div class="months-wrap">${monthBuckets.map((dates,monthIndex)=>`
        <section class="month-section">
          <div class="month-head">
            <div class="month-name">${monthNames[monthIndex]}</div>
            <div class="month-count">${dates.length} ${dates.length===1 ? "fecha" : "fechas"}</div>
          </div>
          ${dates.length ? `<div class="dates">
            ${dates.map(day=>{
              const types=[...new Set(day.events.map(ev=>ev.type))];
              const sources=[...new Set(day.events.map(ev=>ev.source))];
              const theme=brand.themes[day.themeIndex];
              return `
              <article class="date-card">
                <div class="date-top">
                  <div class="date-number">${prettyDate(day.date)}</div>
                  <div class="type">${day.events.length > 1 ? `${day.events.length} oportunidades` : types[0]}</div>
                </div>

                <div class="theme-chip">${theme.icon} ${theme.name}</div>

                <div class="event-list">
                  ${day.events.map(ev=>`
                    <div class="event-item">
                      <div class="event-name">${ev.name}</div>
                      ${day.events.length > 1 ? `<div class="event-mini-type">${ev.type}</div>` : ``}
                    </div>
                  `).join("")}
                </div>

                ${day.themeLabels.length > 1 ? `
                  <div class="cross-themes">${day.themeLabels.join(" · ")}</div>
                ` : ``}

                <div class="source">Fuente / referencia: ${sources.join(" · ")}</div>
              </article>`;
            }).join("")}
          </div>` : `<div class="month-empty">Sin efemérides cargadas para este mes.</div>`}
        </section>
      `).join("")}</div>`;
    })()}

    <div class="legend">
      <strong>Cómo leer el radar:</strong> además de revisar la fecha, ahora cada oportunidad pasa por un filtro de afinidad específico por marca. No basta compartir un tag genérico como “consumo”, “familia” o “digital”: la fecha debe tener una relación editorial directa con el negocio o territorio de contenido. Las fechas oficiales se priorizan desde organismos e instituciones; las marcadas como “Editorial”, “Industria”, “Cultura pop” o “convención” se mantienen claramente diferenciadas.
    </div>
  </article>`;

  detail.querySelector(".close").onclick=()=>openBrand(i);
  setTimeout(()=>detail.scrollIntoView({behavior:"smooth",block:"nearest"}),30);
}

renderGrid();
</script>
